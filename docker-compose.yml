services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/package
    working_dir: /package
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      pgsql:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: vifrost_test
      DB_USERNAME: root
      DB_PASSWORD: secret
      MYSQL_TEST_HOST: db
      MYSQL_TEST_PORT: "3306"
      MYSQL_TEST_DATABASE: vifrost_test
      MYSQL_TEST_USERNAME: root
      MYSQL_TEST_PASSWORD: secret
      MARIADB_TEST_HOST: mariadb
      MARIADB_TEST_PORT: "3306"
      MARIADB_TEST_DATABASE: vifrost_test
      MARIADB_TEST_USERNAME: root
      MARIADB_TEST_PASSWORD: secret
      PGSQL_TEST_HOST: pgsql
      PGSQL_TEST_PORT: "5432"
      PGSQL_TEST_DATABASE: vifrost_test
      PGSQL_TEST_USERNAME: postgres
      PGSQL_TEST_PASSWORD: secret
    tty: true

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: vifrost_test
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 3s
      timeout: 3s
      retries: 15

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_DATABASE: vifrost_test
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 3s
      timeout: 3s
      retries: 15

  pgsql:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: vifrost_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 15
