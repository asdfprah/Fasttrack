name: release

# Only runs after the "tests" workflow finishes successfully on master — never
# releases anything that hasn't passed the test suite. See tests.yml.
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [master]

jobs:
  release-laravel:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-client:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest # trusted publishing needs npm >=11.5.1
      - run: npm ci
        working-directory: adapters
      - run: npm run build
        working-directory: adapters
      - run: npx semantic-release
        working-directory: adapters/vifrost-client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-codegen:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci
        working-directory: adapters
      - run: npm run build
        working-directory: adapters
      - run: npx semantic-release
        working-directory: adapters/vifrost-codegen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-vue:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci
        working-directory: adapters
      - run: npm run build
        working-directory: adapters
      - run: npx semantic-release
        working-directory: adapters/vifrost-vue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
